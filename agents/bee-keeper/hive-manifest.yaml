hive:
  version: "1.2"
  description: "The Sacred Architecture of the Aura Hive - Sanctified"
  nucleotides:
    A: "src/hive/core/aggregator.py"
    T: "src/hive/core/transformer.py"
    C: "src/hive/gateway/connector.py"
    G: "src/hive/scribe/generator.py"
  core_path: "core-service/src/hive"
  dna_path: "packages/aura-core/src/aura_core/dna.py"
  allowed_files:
    - "__init__.py"
    - "aggregator.py"
    - "transformer"
    - "connector"
    - "generator.py"
    - "membrane.py"
    - "metabolism"
    - "dna.py"
    - "types.py"
    - "metrics.py"

  # Sanctified Infrastructure Chambers
  sanctified_chambers:
    core-service/migrations: "HiveEvolutionaryScrolls"
    core-service/tests: "ValidationPollen"
    api-gateway: "HiveGate"
    core-service/src/hive/metabolism/config: "SacredCodex"
    core-service/src/services: "WorkerDirectives"
    core-service/src/llm: "ReasoningNucleus"
    core-service/src/hive/connector: "SecurityCitadel"
    core-service/src/prompts: "EchoChamber"
    core-service/src/guard: "HiveMembrane"
    packages: "HiveNucleotides"
    tests: "OuterValidationPollen"

  # Peripheral Tooling
  tools_shed:
    - "tools/simulators"
