hive:
  version: "1.2"
  description: "The Sacred Architecture of the Aura Hive - Sanctified"
  nucleotides:
    A: "aggregator.py"
    T: "transformer.py"
    C: "connector.py"
    G: "generator.py"
  core_path: "core-service/src/hive"
  dna_path: "core-service/src/hive/dna.py"
  allowed_files:
    - "__init__.py"
    - "aggregator.py"
    - "transformer.py"
    - "connector.py"
    - "generator.py"
    - "membrane.py"
    - "metabolism.py"
    - "dna.py"
    - "types.py"
    - "metrics.py"

  # Sanctified Infrastructure Chambers
  sanctified_chambers:
    core-service/migrations: "HiveEvolutionaryScrolls"
    core-service/tests: "ValidationPollen"
    api-gateway: "HiveGate"
    core-service/src/config: "SacredCodex"
    core-service/src/services: "WorkerDirectives"
    core-service/src/llm: "ReasoningNucleus"
    core-service/src/crypto: "SecurityCitadel"
    core-service/src/prompts: "EchoChamber"
    core-service/src/guard: "HiveMembrane"

  # Peripheral Tooling
  tools_shed:
    - "tools/simulators"
