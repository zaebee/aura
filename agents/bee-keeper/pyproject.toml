[project]
name = "aura-keeper"
version = "0.1.0"
description = "BeeKeeper: The guardian of the Aura Hive"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "litellm>=1.63.0",
    "pygithub>=2.8.1",
    "pydantic-settings>=2.12.0",
    "httpx>=0.28.1",
    "nats-py>=2.12.0",
    "structlog>=25.5.0",
    "pyyaml>=6.0.3",
    "aura-core",
]

[tool.uv.sources]
aura-core = { workspace = true }

[project.scripts]
aura-keeper = "aura_keeper.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Standard src-layout: ship the aura_keeper package (no flat top-level modules,
# no `hive`/`config` collision with other services).
[tool.hatch.build.targets.wheel]
packages = ["src/aura_keeper"]

[tool.uv]
managed = true
package = true

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pydantic-settings>=2.12.0",
    "types-pyyaml>=6.0.12.20250915",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

# An unclosed file is a test failure here, not a warning nobody reads.
#
# These suites read their fixtures with bare `open(...)`, which CPython's
# refcounting closed promptly enough that nothing ever noticed — a correctness
# that rests on an implementation detail rather than on the language. Both
# suites are clean, so this costs nothing today and catches the next one.
filterwarnings = [
    "error::ResourceWarning",
    # The one that actually bites. A ResourceWarning is raised during garbage
    # collection, where an exception cannot propagate, so pytest converts it
    # into this instead — and erroring on ResourceWarning alone leaves the run
    # green with a warning nobody reads. Verified by reintroducing a bare
    # `open(...)` and watching it fail.
    "error::pytest.PytestUnraisableExceptionWarning",
]
