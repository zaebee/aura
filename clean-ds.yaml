apiVersion: v1
kind: ConfigMap
metadata:
  name: aura-unified-datasources
  namespace: monitoring
  labels:
    grafana_datasource: "1"
data:
  # Используем ОДИН ключ, чтобы был ОДИН файл на диске
  all-in-one.yaml: |-
    apiVersion: 1
    datasources:
    - name: Prometheus
      type: prometheus
      uid: prometheus
      url: http://monitoring-kube-prometheus-prometheus:9090
      access: proxy
      isDefault: true
    - name: Jaeger
      type: jaeger
      uid: jaeger
      url: http://aura-jaeger.default.svc.cluster.local:16686
      access: proxy
    - name: Loki
      type: loki
      uid: loki
      url: http://loki:3100
      access: proxy
