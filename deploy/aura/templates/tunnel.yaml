apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ .Release.Name }}-frpc-config"
data:
  frpc.toml: |
    serverAddr = "aura.zae.life"
    serverPort = 7000

    [transport]
    tcpMux = true

    [auth]
    method = "token"

    [auth.tokenSource]
    type = "file"

    [auth.tokenSource.file]
    path = "/etc/frp-token/token"

    [[proxies]]
    name = "frontend"
    type = "tcp"
    localIP = {{ tpl .Values.tunnel.frontend.localIP . | quote }}
    localPort = {{ .Values.frontend.service.port }}
    remotePort = {{ .Values.tunnel.frontend.remotePort }}

    [[proxies]]
    name = "gateway"
    type = "tcp"
    localIP = {{ tpl .Values.tunnel.gateway.localIP . | quote }}
    localPort = {{ .Values.gateway.service.port }}
    remotePort = {{ .Values.tunnel.gateway.remotePort }}

    [[proxies]]
    name = "grafana"
    type = "tcp"
    localIP = {{ .Values.tunnel.grafana.localIP | quote }}
    localPort = {{ .Values.tunnel.grafana.localPort }}
    remotePort = {{ .Values.tunnel.grafana.remotePort }}

    [[proxies]]
    name = "loki"
    type = "tcp"
    localIP = {{ .Values.tunnel.loki.localIP | quote }}
    localPort = {{ .Values.tunnel.loki.localPort }}
    remotePort = {{ .Values.tunnel.loki.remotePort }}

    [[proxies]]
    name = "hive-nats"
    type = "stcp"
    secretKey = "{{ "{{" }} .Envs.FRP_STCP_SECRET_KEY {{ "}}" }}"
    localIP = "{{ .Release.Name }}-nats"
    localPort = 4222

    [[visitors]]
    name = "ollama-worker-visitor"
    serverName = "ollama-worker-colab-savant"
    type = "stcp"
    bindAddr = "127.0.0.1"
    bindPort = 11435
    secretKey = "{{ "{{" }} .Envs.FRP_STCP_SECRET_KEY {{ "}}" }}"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ .Release.Name }}-frpc-tunnel"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frpc
      component: tunnel
  template:
    metadata:
      labels:
        app: frpc
        component: tunnel
    spec:
      containers:
      - name: frpc
        image: "{{ .Values.tunnel.image.repository }}:{{ .Values.tunnel.image.tag }}"
        imagePullPolicy: {{ .Values.tunnel.image.pullPolicy | default "IfNotPresent" }}
        env:
        - name: FRP_STCP_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: "{{ .Release.Name }}-secrets"
              key: "stcp-key"
        command: ["frpc", "-c", "/etc/frp/frpc.toml"]
        # command: ["/usr/local/bin/entrypoint.sh"]
        volumeMounts:
        - name: config-volume
          mountPath: /etc/frp/
        - name: token-volume
          mountPath: /etc/frp-token/token
          subPath: frp-token
        - name: entrypoint-volume
          mountPath: /usr/local/bin/entrypoint.sh
          subPath: entrypoint.sh
          readOnly: true
      volumes:
      - name: config-volume
        configMap:
          name: "{{ .Release.Name }}-frpc-config"
      - name: token-volume
        secret:
          secretName: "{{ .Release.Name }}-secrets"
          items:
          - key: frp-client-token
            path: frp-token
      - name: entrypoint-volume
        configMap:
          name: {{ .Release.Name }}-frpc-entrypoint-config
          defaultMode: 0755
