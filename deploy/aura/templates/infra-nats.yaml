apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ .Release.Name }}-nats-config"
data:
  nats.conf: |
    max_payload: 8mb
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ .Release.Name }}-nats"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
    spec:
      containers:
      - name: nats
        image: nats:2.10-alpine
        args:
          - "-c"
          - "/etc/nats/nats.conf"
          {{- if .Values.nats.jetstream.enabled }}
          - "--js"
          - "--sd=/data/jetstream"
          {{- end }}
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 64Mi
        ports:
        - containerPort: 4222 # Client port
        - containerPort: 8222 # Monitoring port
        livenessProbe:
          tcpSocket:
            port: 4222
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: 4222
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 2
        volumeMounts:
        - name: nats-config
          mountPath: /etc/nats
        {{- if .Values.nats.jetstream.enabled }}
        - name: nats-data
          mountPath: /data/jetstream
        {{- end }}
      volumes:
      - name: nats-config
        configMap:
          name: "{{ .Release.Name }}-nats-config"
      {{- if .Values.nats.jetstream.enabled }}
      - name: nats-data
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-nats-js-pvc
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: "{{ .Release.Name }}-nats"
spec:
  selector:
    app: nats
  ports:
  - port: 4222
    targetPort: 4222
