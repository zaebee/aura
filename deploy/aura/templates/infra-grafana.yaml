{{- if .Values.grafana.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ .Release.Name }}-grafana"
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:10.2.3
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: GF_AUTH_ANONYMOUS_ENABLED
          value: "true"
        - name: GF_AUTH_ANONYMOUS_ORG_ROLE
          value: "Admin"
        - name: GF_SERVER_ROOT_URL
          value: "https://crm.zae.life"
        volumeMounts:
        - name: datasources
          mountPath: /etc/grafana/provisioning/datasources
        - name: dashboards-prov
          mountPath: /etc/grafana/provisioning/dashboards
        - name: dashboards-data
          mountPath: /var/lib/grafana/dashboards
      volumes:
      - name: datasources
        configMap:
          name: "{{ .Release.Name }}-grafana-datasources"
      - name: dashboards-prov
        configMap:
          name: "{{ .Release.Name }}-grafana-dashboards-prov"
      - name: dashboards-data
        configMap:
          name: "{{ .Release.Name }}-grafana-dashboards-data"
---
apiVersion: v1
kind: Service
metadata:
  name: "{{ .Release.Name }}-grafana"
  labels:
    app: grafana
spec:
  type: {{ .Values.grafana.service.type | default "ClusterIP" }}
  ports:
  - port: 3000
    targetPort: 3000
    name: http
  selector:
    app: grafana
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ .Release.Name }}-grafana-datasources"
data:
  datasources.yaml: |
{{- if .Values.grafana.datasources }}
{{- toYaml (index .Values.grafana.datasources "datasources.yaml") | nindent 4 }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ .Release.Name }}-grafana-dashboards-prov"
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
    - name: 'default'
      orgId: 1
      folder: ''
      type: file
      disableDeletion: false
      editable: true
      options:
        path: /var/lib/grafana/dashboards
{{- end }}
