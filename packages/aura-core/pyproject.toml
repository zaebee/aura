[build-system]
requires = ["hatchling", "hatch-vcs", "betterproto[compiler]", "grpcio-tools", "structlog"]
build-backend = "hatchling.build"

[project]
name = "aura-core"
version = "0.1.0"
description = "Core DNA for Aura Hive"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "opentelemetry-api>=1.20.0",
    "betterproto[compiler]>=2.0.0b7",
    "structlog>=25.0.0",
    "grpcio-tools>=1.76.0",
]

[tool.hatch.build.targets.wheel]
# gen-proto/aura_core_gen is deliberately absent: gen_hooks.py force_includes it.
# Listing it here too would work in a checkout (where .gitignore suppresses this
# selection) and break in a Docker context (where nothing is ignored, both
# mechanisms fire, and hatchling aborts on the duplicate path).
packages = ["src/aura_core"]

[tool.hatch.build.targets.sdist]
include = [
    "/gen_hooks.py",
    "/src",
    "/proto",
]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "gen_hooks.py"

[dependency-groups]
dev = [
    "betterproto[compiler]>=2.0.0b7",
    "build>=1.4.0",
    "grpcio-tools>=1.76.0",
    "hatchling>=1.28.0",
]
