[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aura-protein-solana"
version = "0.1.0"
description = "Solana Payment Organ for Aura Hive"
requires-python = ">=3.12"
dependencies = [
    "solana>=0.34.0",
    "solders>=0.21.0",
    "httpx>=0.27.0",
    "aura-core",
]

[tool.uv.sources]
aura-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/aura_protein_solana"]
