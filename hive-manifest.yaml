# Hive Manifest - Language-Agnostic Geography
# This file defines the structural layout of the Hive.
# It can be read by any Bee, regardless of its programming language.

version: "1.0"

# The ATCG macro folders - top-level directories in the monorepo
macro_atcg_folders:
  - core
  - api-gateway
  - frontend
  - adapters
  - agents
  - proto
  - docs
  - tools
  - deploy
  - packages

# Files allowed at the repository root
allowed_root_files:
  - README.md
  - llms.txt
  - HIVE_STATE.md
  - pyproject.toml
  - uv.lock
  - .gitignore
  - Makefile
  - buf.gen.yaml
  - buf.yaml
  - .python-version
  - .dockerignore
  - .env.example
  - compose.yml
  - .pre-commit-config.yaml
  - CLAUDE.md
  - CRYPTO_INTEGRATION_SUMMARY.md
  - CRYPTO_QUICKSTART.md
  - hive-manifest.yaml

# Paths outside the core nucleotides that bee.Keeper treats as legitimate.
# Matching is prefix-based, so a directory covers everything beneath it.
allowed_chambers:
  - agents
  - api-gateway
  - core/migrations
  - core/scripts
  - core/tests
  - deploy
  - docs
  - frontend
  - packages
  - proto
  - synapses
  - tools

# Paths where non-determinism is permitted outside a Transformer (the Javana Law).
# Config, scripts, the composition root, and the two proteins whose whole purpose
# is to call a model.
javana_exempt_paths:
  - core/scripts
  - core/tests
  - tests
  - tools
  - core/src/aura_hive/config
  - core/src/aura_hive/hive/cortex.py
  - core/src/aura_hive/hive/proteins/discovery
  - core/src/aura_hive/hive/proteins/reasoning
  - agents/bee-evolver/src/config.py

# The membrane's own surface. A pull request from an automated author may not
# touch these: the loop must not be able to widen its permissions or weaken the
# guard that checks it. Human authors are labelled, not blocked.
protected_paths:
  - hive-manifest.yaml
  - packages/aura-core/src/aura_core/dna.py
  - packages/aura-core/src/aura_core/javana.py
  - packages/aura-core/src/aura_core/manifest.py
  - core/src/aura_hive/hive/membrane
  - tools/membrane_check.py
  - .github/workflows

# Git authors treated as automated. Their pull requests are held for review
# whenever they touch protected_paths.
automated_authors:
  - bee.Evolver
  - bee.Keeper
  - github-actions[bot]
