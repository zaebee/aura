name: bee.Evolver

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      focus:
        description: 'Optional focus hint for the Evolver (e.g. "improve prompts", "fix heresies")'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Run the full cycle but open no PR or Issues (for cost-baseline collection)'
        required: false
        default: false
        type: boolean

jobs:
  evolve:
    name: Evolutionary Cycle
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout Hive
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Dependencies
        run: |
          uv python install 3.12
          uv sync --directory agents/bee-evolver

      - name: Configure Git Identity
        run: |
          git config --global user.name "bee.Evolver"
          git config --global user.email "evolver@aura.hive"

      - name: Run bee.Evolver
        env:
          AURA_LLM__API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          AURA_LLM__MODEL: "mistral/mistral-large-latest"
          AURA_LLM__FALLBACK_MODEL: "openai/gpt-4o-mini"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          AURA_TELEGRAM_TOKEN: ${{ secrets.AURA_TELEGRAM_TOKEN }}
          AURA_BEE_KEEPER__ADMIN_CHAT_ID: ${{ secrets.AURA_BEE_KEEPER__ADMIN_CHAT_ID }}
          EVOLVER_ASSIGNEE: "zaebee"
          EVOLVER_FOCUS: ${{ inputs.focus || '' }}
          EVOLVER_MAX_IMPROVEMENTS: "3"
          AURA_BEE_EVOLVER__MAX_TOKENS: "2000"
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AURA_METABOLISM_LOG: "${{ github.workspace }}/.hive/metabolism.jsonl"
          GITHUB_SHA: ${{ github.sha }}
          # Empty on scheduled runs, so the fallback keeps the default off.
          EVOLVER_DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          uv run --directory agents/bee-evolver python main.py

      # The writer swallows its own failures so it can never crash the bee.
      # This step is where a silent failure becomes loud instead.
      - name: Assert metabolic record was written
        if: always()
        run: |
          if [ ! -s .hive/metabolism.jsonl ]; then
            echo "::error::No metabolic record written — instrumentation is broken."
            exit 1
          fi
          wc -l .hive/metabolism.jsonl

      - name: Upload metabolic record
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: metabolism-evolver-${{ github.run_id }}
          path: .hive/metabolism.jsonl
          retention-days: 90
