      - name: Run bee.Keeper
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          AURA_LLM__API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          AURA_LLM__MODEL: "mistral/mistral-large-latest"
          AURA_LLM__FALLBACK_MODEL: "openai/gpt-4o-mini"
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AURA_LLM__OLLAMA_BASE_URL: "http://localhost:11434"
          AURA_PROMETHEUS_URL: "http://monitoring-kube-prometheus-prometheus.monitoring:9090"
          AURA_NATS_URL: "nats://nats:4222"
          AURA_BEE_KEEPER__MAX_TOKENS: 1000
        run: |
          # Configure git for auto-commits
          git config --global user.name "bee.Keeper"
          git config --global user.email "keeper@aura.hive"

          uv run --directory agents/bee-keeper python main.py
