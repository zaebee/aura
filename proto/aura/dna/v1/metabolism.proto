// Metabolism Protocol Buffers - Nucleotide Signals for the Hive
//
// This file defines the ATCG-M metabolic pattern signals that flow through
// the Hive's bloodstream. These are the "nucleotides" of our genetic code
// that enable the organism's metabolism, now with full Asset support.

syntax = "proto3";

package aura.dna.v1;

import "aura/dna/v1/base.proto";
import "aura/dna/v1/assets.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/any.proto";

// =============================================================================
// SIGNAL - Inbound stimulus to the Hive (A - Aggregator input)
// =============================================================================

message Signal {
  string identifier = 1;  // Schema.org compliant
  SignalType signal_type = 2;
  google.protobuf.Timestamp timestamp = 3;
  map<string, string> metadata = 4;
  TraceContext trace = 5;

  // Strictly typed payload - no Struct
  oneof payload {
    NegotiationSignal negotiation = 10;
    AuditSignal audit = 11;
    TelegramSignal telegram = 12;
    HeartbeatSignal heartbeat = 13;
    PerceptionSignal perception = 14;
    AssetSignal asset = 15;  // Asset-related signals
  }
}

enum SignalType {
  SIGNAL_TYPE_UNSPECIFIED = 0;
  SIGNAL_TYPE_NEGOTIATION = 1;
  SIGNAL_TYPE_AUDIT = 2;
  SIGNAL_TYPE_TELEGRAM = 3;
  SIGNAL_TYPE_HEARTBEAT = 4;
  SIGNAL_TYPE_PERCEPTION = 5;
  SIGNAL_TYPE_ASSET = 6;  // Asset signals
}

// Asset-specific signal
message AssetSignal {
  string asset_identifier = 1;
  AssetDomain asset_domain = 2;
  string signal_subtype = 3;  // "discovery", "availability_change", "price_update", "booking_request"
  google.protobuf.Any asset_data = 4;
}

// Existing signal types
message NegotiationSignal {
  string item_identifier = 1;
  double bid_amount = 2;
  string currency_code = 3;
  AgentIdentity agent = 4;
}

message AgentIdentity {
  string did = 1;             // Decentralized identifier
  float reputation_score = 2; // Reputation score from middleware
}

message AuditSignal {
  string repo_name = 1;
  string git_diff = 2;
  repeated string filesystem_map = 3;
  string event_name = 4;
}

message TelegramSignal {
  int64 user_id = 1;
  int64 chat_id = 2;
  string message_text = 3;
  string callback_data = 4;
}

message HeartbeatSignal {
  string service_name = 1;
  string instance_id = 2;
}

message PerceptionSignal {
  bytes image_data = 1;
  string mime_type = 2;
  AgentIdentity agent = 3;
}

// =============================================================================
// CONTEXT - Enriched understanding after Aggregator processing
// =============================================================================

message Context {
  string identifier = 1;  // Schema.org compliant
  ContextType context_type = 2;
  Status system_health = 3;
  map<string, string> metadata = 4;
  TraceContext trace = 5;

  // Strictly typed context data
  oneof data {
    HiveContextData hive = 10;
    BeeContextData bee = 11;
    TelegramContextData telegram = 12;
    AssetContextData asset = 13;  // Asset context
  }
}

enum ContextType {
  CONTEXT_TYPE_UNSPECIFIED = 0;
  CONTEXT_TYPE_HIVE = 1;
  CONTEXT_TYPE_BEE = 2;
  CONTEXT_TYPE_TELEGRAM = 3;
  CONTEXT_TYPE_ASSET = 4;  // Asset context
}

// Asset-specific context
message AssetContextData {
  Asset asset = 1;
  AssetCollection related_assets = 2;
  string search_query = 3;
  map<string, string> search_parameters = 4;
  Location search_location = 5;
  float search_radius_km = 6;
}

// Existing context types
message HiveContextData {
  string item_identifier = 1;
  NegotiationOffer offer = 2;
  Asset item = 3;  // Updated to use Asset
  string request_id = 4;
}

message NegotiationOffer {
  double bid_amount = 1;
  float reputation = 2;
  string agent_did = 3;
}

message BeeContextData {
  string repo_name = 1;
  string git_diff = 2;
  repeated string filesystem_map = 3;
  map<string, double> hive_metrics = 4;
}

message TelegramContextData {
  int64 user_id = 1;
  int64 chat_id = 2;
  string message_text = 3;
  string fsm_state = 4;
}

// =============================================================================
// INTENT - Decision made by the Transformer (T output)
// =============================================================================

message Intent {
  string identifier = 1;  // Schema.org compliant
  ActionType action = 2;
  string reasoning = 3;
  repeated IntentStep steps = 4;
  map<string, string> metadata = 5;
  TraceContext trace = 6;

  // Strictly typed action params
  oneof params {
    NegotiationIntent negotiation = 10;
    AuditIntent audit = 11;
    UIIntent ui = 12;
    AssetIntent asset = 13;  // Asset intent
  }
}

enum ActionType {
  ACTION_TYPE_UNSPECIFIED = 0;
  ACTION_TYPE_ACCEPT = 1;
  ACTION_TYPE_COUNTER = 2;
  ACTION_TYPE_REJECT = 3;
  ACTION_TYPE_AUDIT = 4;
  ACTION_TYPE_UI_REQUIRED = 5;
  ACTION_TYPE_ERROR = 6;
  ACTION_TYPE_ASSET_ACTION = 7;  // Asset-specific actions
}

// Asset-specific intent
message AssetIntent {
  string asset_identifier = 1;
  AssetAction action_type = 2;
  map<string, string> action_parameters = 3;
  google.protobuf.Any action_data = 4;
  AssetDomain asset_domain = 5;
}

enum AssetAction {
  ASSET_ACTION_UNSPECIFIED = 0;
  ASSET_ACTION_SEARCH = 1;
  ASSET_ACTION_RESERVE = 2;
  ASSET_ACTION_PURCHASE = 3;
  ASSET_ACTION_RELEASE = 4;
  ASSET_ACTION_UPDATE = 5;
  ASSET_ACTION_EVALUATE = 6;
  ASSET_ACTION_APPROVE = 7;
  ASSET_ACTION_REJECT = 8;
  ASSET_ACTION_CANCEL = 9;
}

// Existing intent types
message NegotiationIntent {
  double price = 1;
  string message = 2;
  string thought = 3;
}

message AuditIntent {
  bool is_pure = 1;
  repeated string heresies = 2;
  string narrative = 3;
}

message UIIntent {
  string template_id = 1;
  string text = 2;
  string parse_mode = 3;
}

message IntentStep {
  string skill = 1;
  string intent = 2;
  // Use Any for step params since they vary by skill
  google.protobuf.Any params = 3;
}

// =============================================================================
// OBSERVATION - Result of Connector execution (C output)
// =============================================================================

message Observation {
  bool success = 1;
  int64 message_id = 2;
  string error = 3;
  string event_type = 4;
  map<string, string> metadata = 5;
  TraceContext trace = 6;

  // Strictly typed observation data
  oneof data {
    NegotiationObservation negotiation = 10;
    AuditObservation audit = 11;
    TelegramObservation telegram = 12;
    PerceptionObservation perception = 13;
    AssetObservation asset = 14;  // Asset observation
  }
}

// Asset-specific observation
message AssetObservation {
  string asset_identifier = 1;
  Status status = 2;
  Asset asset = 3;
  string reservation_code = 4;
  Money final_price = 5;
  map<string, string> result_data = 6;
  AssetDomain asset_domain = 7;
  AssetBooking booking = 8;
}

// Existing observation types
message NegotiationObservation {
  string session_token = 1;
  int64 valid_until_timestamp = 2;
  string payment_uri = 6;

  oneof result {
    OfferAccepted accepted = 3;
    OfferCountered countered = 4;
    OfferRejected rejected = 5;
  }
}

message OfferAccepted {
  double final_price = 1;

  // Either reservation_code (legacy) or crypto_payment (new)
  oneof reveal_method {
    string reservation_code = 2;
    CryptoPaymentInstructions crypto_payment = 3;
  }
}

// Instructions for completing a crypto payment to unlock the deal
message CryptoPaymentInstructions {
  string deal_id = 1;              // UUID of the locked deal
  string wallet_address = 2;       // Payment destination address
  double amount = 3;               // Amount to pay
  string currency = 4;             // "SOL" or "USDC"
  string memo = 5;                 // Unique memo to include in transaction
  string network = 6;              // "mainnet-beta", "devnet", "testnet"
  int64 expires_at = 7;            // Unix timestamp when deal expires
}

message OfferCountered {
  double proposed_price = 1;
  string reason_code = 2;
  string human_message = 3;
}

message OfferRejected {
  string reason_code = 1;
}

message AuditObservation {
  bool is_pure = 1;
  repeated string heresies = 2;
  string narrative = 3;
  string reasoning = 4;
  double execution_time = 5;
  int32 token_usage = 6;
}

message TelegramObservation {
  int64 message_id = 1;
  bool delivered = 2;
}

message PerceptionObservation {
  Asset item = 1;  // Updated to use Asset
}

message PaymentProof {
  string transaction_hash = 1;
  string block_number = 2;
  string from_address = 3;
  google.protobuf.Timestamp confirmed_at = 4;
}

message TransactionContext {
  string deal_id = 1;
  double amount = 2;
  string currency = 3;
  string status = 4; // excited, ground
}

// =============================================================================
// EVENT - Emitted to the Hive's bloodstream (G output -> NATS JetStream)
// =============================================================================

message Event {
  string identifier = 1;  // Schema.org compliant
  string topic = 2;
  google.protobuf.Timestamp timestamp = 3;
  map<string, string> metadata = 4;
  TraceContext trace = 5;

  // Strictly typed event payload
  oneof payload {
    NegotiationEvent negotiation = 10;
    VitalsEvent vitals = 11;
    AlertEvent alert = 12;
    HeartbeatEvent heartbeat = 13;
    AuditEvent audit = 14;
    LogEvent log = 15;
    AssetEvent asset = 16;  // Asset event
  }
}

// Existing event types
message LogEvent {
  string level = 1;
  string message = 2;
  string logger_name = 3;
  string worker_name = 4;
}

message NegotiationEvent {
  string session_token = 1;
  ActionType action = 2;
  double price = 3;
  string item_id = 4;
  string agent_did = 5;
}

message VitalsEvent {
  string service = 1;
  Status status = 2;
  double cpu_usage_percent = 3;
  double memory_usage_mb = 4;
}

message AlertEvent {
  Severity severity = 1;
  string message = 2;
  string source = 3;
}

message HeartbeatEvent {
  string service = 1;
  string instance_id = 2;
  Status status = 3;
}

message AuditEvent {
  string repo_name = 1;
  bool is_pure = 2;
  repeated string heresies = 3;
  double negotiation_success_rate = 4;
}

// =============================================================================
// SYSTEM VITALS - Health metrics for proprioception
// =============================================================================

// System vitals using base types
message SystemVitals {
  Status status = 1;
  double cpu_usage_percent = 2;
  double memory_usage_mb = 3;
  google.protobuf.Timestamp timestamp = 4;
  bool cached = 5;
  repeated string warnings = 6;
  string error = 7;
}
