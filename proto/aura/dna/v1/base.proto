// Base Protocol Buffers - Common Types for the Hive Genome
//
// This file contains fundamental data types used across all chromosomal
// structures. These are the "nucleotides" of our genetic code.

syntax = "proto3";

package aura.dna.v1;

import "google/protobuf/timestamp.proto";

// =============================================================================
// COMMON TYPES - Fundamental building blocks
// =============================================================================

// Unique identifier following Schema.org conventions
message Identifier {
  string identifier = 1;  // Schema.org compliant field name
  string legacy_id = 2;   // For backward compatibility
}

// Monetary amount with currency specification (compatible with User's Money type)
message Money {
  double amount = 1;
  string currency_code = 2;  // ISO 4217 currency code (USD, EUR, etc.)
  string currency_symbol = 3; // Optional display symbol ($, €, etc.)
}

// Geographic location with Schema.org compatibility
message Location {
  double latitude = 1;
  double longitude = 2;
  string address = 3;        // Human-readable address
  string city = 4;
  string region = 5;         // State/province
  string country_code = 6;   // ISO 3166-1 alpha-2 country code
  string postal_code = 7;
  string formatted_address = 8; // Full formatted address
}

// Rating and review information (compatible with User's RatingStats)
message Rating {
  double value = 1;         // Rating value (typically 1.0 to 5.0)
  int32 count = 2;          // Number of ratings/reviews
  double best_rating = 3;   // Maximum possible rating (default: 5.0)
  double worst_rating = 4;  // Minimum possible rating (default: 1.0)
}

// Temporal availability window
message TimeSpan {
  google.protobuf.Timestamp start = 1;
  google.protobuf.Timestamp end = 2;
  string time_zone = 3;     // IANA time zone identifier
}

// System vitals and health metrics
message Vitals {
  double cpu_usage_percent = 1;
  double memory_usage_mb = 2;
  double disk_usage_percent = 3;
  double network_latency_ms = 4;
  string status = 5;         // OK, DEGRADED, ERROR, CRITICAL
  google.protobuf.Timestamp timestamp = 6;
}

// Trace context for distributed tracing (OpenTelemetry compatible)
message TraceContext {
  string trace_id = 1;      // W3C Trace Context trace-id
  string span_id = 2;       // W3C Trace Context span-id
  string trace_flags = 3;   // Sampling flags
  string trace_state = 4;   // Vendor-specific trace state
}

// =============================================================================
// ENUMS - Common enumerations
// =============================================================================

// Standard status values
enum Status {
  STATUS_UNSPECIFIED = 0;
  STATUS_OK = 1;
  STATUS_DEGRADED = 2;
  STATUS_ERROR = 3;
  STATUS_CRITICAL = 4;
}

// Severity levels for alerts and events
enum Severity {
  SEVERITY_UNSPECIFIED = 0;
  SEVERITY_INFO = 1;
  SEVERITY_WARNING = 2;
  SEVERITY_ERROR = 3;
  SEVERITY_CRITICAL = 4;
}
