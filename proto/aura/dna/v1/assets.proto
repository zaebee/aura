// Assets Protocol Buffers - Universal Asset Model for the Hive
//
// This file defines the comprehensive asset model based on the User's Asset Draft,
// with Mobility research integrated into the oneof details structure.
// This is the "genome" for asset representation following the Sovereign Contract pattern.

syntax = "proto3";

package aura.dna.v1;

import "aura/dna/v1/base.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/any.proto";

// =============================================================================
// DOMAIN ENUMS - From User's Asset Draft
// ============================================================================

enum AssetDomain {
  ASSET_DOMAIN_UNSPECIFIED = 0;
  ASSET_DOMAIN_VEHICLE = 1;      // Car, bike, scooter rental
  ASSET_DOMAIN_PROPERTY = 2;     // Short-term rentals (Airbnb-style)
  ASSET_DOMAIN_EQUIPMENT = 3;    // Tools, cameras, sports gear
  ASSET_DOMAIN_WORKSPACE = 4;    // Coworking, meeting rooms
}

enum AssetStatus {
  ASSET_STATUS_UNSPECIFIED = 0;
  ASSET_STATUS_DRAFT = 1;          // Not yet published
  ASSET_STATUS_AVAILABLE = 2;      // Open for bookings
  ASSET_STATUS_BOOKED = 3;         // Currently rented
  ASSET_STATUS_MAINTENANCE = 4;    // Under maintenance
  ASSET_STATUS_ARCHIVED = 5;       // Deactivated
}

enum AssetCondition {
  ASSET_CONDITION_UNSPECIFIED = 0;
  ASSET_CONDITION_NEW = 1;
  ASSET_CONDITION_EXCELLENT = 2;
  ASSET_CONDITION_GOOD = 3;
  ASSET_CONDITION_FAIR = 4;
  ASSET_CONDITION_POOR = 5;
}

enum RentalFrequency {
  RENTAL_FREQUENCY_UNSPECIFIED = 0;
  RENTAL_FREQUENCY_HOURLY = 1;
  RENTAL_FREQUENCY_DAILY = 2;
  RENTAL_FREQUENCY_WEEKLY = 3;
  RENTAL_FREQUENCY_MONTHLY = 4;
  RENTAL_FREQUENCY_CUSTOM = 5;
}

// =============================================================================
// CORE RENTAL CONTRACT - From User's Asset Draft
// ============================================================================

/**
 * RentalTerms defines the contract for how an asset can be rented.
 * This is domain-agnostic and applies to all rentable assets.
 */
message RentalTerms {
  // Pricing
  repeated PriceTier price_tiers = 1;        // Duration-based pricing
  Money security_deposit = 2;                // Upfront deposit/collateral
  repeated Money cancellation_fees = 3;      // Fees per cancellation window

  // Availability
  repeated AvailabilityWindow availability_windows = 4;
  int32 min_rental_duration_hours = 5;       // Minimum rental period
  int32 max_rental_duration_hours = 6;       // Maximum rental period

  // Operational constraints
  bool requires_approval = 7;                // Must owner approve manually?
  int32 approval_timeout_hours = 8;          // Time limit for approval
  int32 no_response_auto_cancel_hours = 9;   // Auto-cancel if no response

  // Damage & liability
  DamagePolicy damage_policy = 10;
  InsurancePolicy insurance_policy = 11;

  // Restrictions
  repeated string allowed_countries = 12;    // Geo-restrictions
  int32 min_renter_age = 13;
  map<string, string> custom_rules = 14;     // Domain-specific rules
}

message PriceTier {
  int32 min_duration_days = 1;    // Applies from this duration
  int32 max_duration_days = 2;    // Until this duration (0 = unlimited)
  Money price_per_day = 3;
  float discount_percent = 4;     // E.g., 10% off for weekly rentals
}

message AvailabilityWindow {
  int32 day_of_week = 1;          // 0=Monday, 6=Sunday
  int32 start_hour = 2;           // 0-23
  int32 end_hour = 3;             // 0-23
  bool is_blocked = 4;            // True = asset not available
}

message DamagePolicy {
  enum DamageLevel {
    UNSPECIFIED = 0;
    MINOR = 1;
    MODERATE = 2;
    SEVERE = 3;
    TOTAL_LOSS = 4;
  }
  map<int32, Money> damage_charges = 1;  // DamageLevel -> charge
  Money deductible = 2;                   // Renter pays up to this amount
  bool optional = 3;                      // Can renter decline coverage?
}

message InsurancePolicy {
  Money premium_per_day = 1;
  string provider = 2;
  string policy_number = 3;
  Money max_coverage = 4;
  bool included_in_base_price = 5;
  string coverage_details = 6;            // HTML or markdown
}

// =============================================================================
// CORE ASSET ENTITY - From User's Asset Draft with Mobility Integration
// ============================================================================

/**
 * Asset is the primary rental object, domain-agnostic.
 * Core properties apply to all domains. Domain-specific attributes in oneof.
 */
message Asset {
  // === CORE IDENTIFIERS ===
  string identifier = 1;                          // UUID
  string organization_id = 2;             // Owner/organization UUID

  // === DISPLAY & CLASSIFICATION ===
  string name = 3;                        // "BMW X5" or "Downtown Loft"
  string description = 4;                 // Marketing description
  repeated string images = 5;             // Image URLs (primary first)
  string thumbnail_url = 6;               // Quick-load thumbnail

  AssetDomain domain = 7;
  AssetStatus status = 8;
  AssetCondition condition = 9;

  // === RENTAL CONTRACT ===
  RentalTerms rental_terms = 10;          // How this asset can be rented

  // === DOMAIN-SPECIFIC DETAILS ===
  oneof details {
    VehicleAttributes vehicle = 11;        // Mobility research integrated here
    PropertyAttributes property = 12;
    EquipmentAttributes equipment = 13;
    WorkspaceAttributes workspace = 14;
  }

  // === OPERATIONAL DATA ===
  OperationalMetadata operations = 15;    // Maintenance, incidents, capacity

  // === REPUTATION & RATINGS ===
  Rating rating_stats = 16; // Aggregate ratings

  // === TIMESTAMPS ===
  google.protobuf.Timestamp created_at = 20;
  google.protobuf.Timestamp updated_at = 21;

  // === METADATA ===
  AssetPublicationStats stats = 22;
  bool is_published = 23;                 // Ready for public discovery?
}

// =============================================================================
// OPERATIONAL METADATA - From User's Asset Draft
// ============================================================================

/**
 * OperationalMetadata tracks non-rental data about asset management.
 */
message OperationalMetadata {
  // Maintenance
  MaintenanceSchedule maintenance_schedule = 1;
  google.protobuf.Timestamp last_maintenance_at = 2;
  google.protobuf.Timestamp next_maintenance_at = 3;

  // Capacity & inventory
  int32 total_units = 4;                  // For multi-unit assets
  int32 available_units = 5;              // How many free right now

  // Current state
  string current_location = 6;            // Where is it right now?
  float current_occupancy_percent = 7;    // 0-100

  // Incidents & damage log
  repeated IncidentLog incidents = 8;

  // Service-level agreements
  string sla_tier = 9;                    // "basic", "premium", "enterprise"
  google.protobuf.Timestamp last_inspection_at = 10;
}

message MaintenanceSchedule {
  enum MaintenanceType {
    UNSPECIFIED = 0;
    ROUTINE = 1;
    SEASONAL = 2;
    EMERGENCY = 3;
  }
  MaintenanceType type = 1;
  int32 frequency_days = 2;               // Every N days
  string description = 3;
  repeated google.protobuf.Timestamp scheduled_dates = 4;
}

message IncidentLog {
  string identifier = 1;
  google.protobuf.Timestamp date = 2;
  string severity = 3;                    // "minor", "major", "critical"
  string description = 4;
  string reported_by = 5;                 // renter or owner
  Money repair_cost = 6;
  string status = 7;                      // "open", "in_progress", "resolved"
}

// =============================================================================
// DOMAIN-SPECIFIC ATTRIBUTES - Enhanced with Mobility Research
// ============================================================================

// VehicleAttributes - Merged Mobility Research with User's Draft
message VehicleAttributes {
  // Legal identifiers
  string registration_number = 1;
  string vin = 2;                          // Vehicle Identification Number
  string license_plate = 3;

  // Classification (enhanced from mobility research)
  string type = 4;                         // "car", "motorcycle", "scooter", "bike", "e_bike", "e_scooter"
  string sub_type = 5;                     // "sedan", "suv", "hatchback", "luxury", "compact", "exotic"

  // Basic specs
  string brand = 6;
  string model = 7;
  int32 year = 8;
  string color = 9;

  // Performance specs (enhanced with EV support)
  string transmission = 10;                // "automatic", "manual", "cvt", "direct_drive"
  string fuel_type = 11;                   // "petrol", "diesel", "electric", "hybrid", "hydrogen", "cng"
  float fuel_capacity_liters = 12;
  float current_fuel_level_percent = 13;
  float current_battery_level_percent = 14; // 0.0 to 100.0 for EVs
  float battery_capacity_kwh = 15;        // For electric vehicles
  float estimated_range_km = 16;           // Current range estimate
  float max_range_km = 17;                 // Maximum range when fully charged/fueled
  bool is_charging = 18;                   // Currently charging?
  float charging_speed_kw = 19;           // Charging speed in kW
  float engine_capacity_cc = 20;
  float mileage_km = 21;
  float max_speed_kph = 22;               // Maximum speed

  // Capacity
  int32 seats = 23;
  int32 doors = 24;
  float max_luggage_capacity_liters = 25;
  float max_weight_kg = 26;
  int32 baggage_capacity_large = 27;      // Large suitcases
  int32 baggage_capacity_small = 28;      // Small suitcases

  // Features (enhanced from mobility research)
  bool air_conditioning = 29;
  bool navigation_system = 30;
  bool bluetooth = 31;
  bool all_wheel_drive = 32;
  bool sunroof = 33;
  bool cruise_control = 34;
  bool airbags = 35;
  bool wheelchair_accessible = 36;
  bool adaptive_cruise_control = 37;     // Advanced driver assistance
  bool lane_keeping_assist = 38;
  bool blind_spot_monitoring = 39;
  bool rear_view_camera = 40;
  bool apple_car_play = 41;
  bool android_auto = 42;
  bool heated_seats = 43;
  bool ventilated_seats = 44;
  bool massage_seats = 45;
  bool premium_audio = 46;
  bool panoramic_roof = 47;
  bool keyless_entry = 48;
  bool remote_start = 49;
  bool wireless_charging = 50;
  bool heads_up_display = 51;
  bool ambient_lighting = 52;
  bool memory_seats = 53;
  bool heated_steering_wheel = 54;
  bool power_liftgate = 55;
  bool surround_view_camera = 56;
  bool night_vision = 57;
  bool self_parking = 58;

  // Safety requirements
  bool helmet_required = 59;               // For bikes/scooters
  int32 minimum_driver_age = 60;
  repeated string required_licenses = 61; // "car", "motorcycle", "commercial"

  // Electric vehicle specific
  string charger_type = 62;               // "Type1", "Type2", "CCS", "CHAdeMO", "Tesla"
  float charging_time_hours = 63;        // 0-100% charge time
  bool fast_charging_capable = 64;

  // Connectivity
  bool connected_car = 65;
  bool remote_diagnostics = 66;
  bool over_the_air_updates = 67;
  bool emergency_call_system = 68;

  // Comfort & Convenience
  bool keyless_ignition = 69;
  bool automatic_climate_control = 70;
  bool multi_zone_climate_control = 71;
  bool rear_climate_controls = 72;
  bool power_adjustable_seats = 73;
  bool power_adjustable_steering = 74;
  bool rain_sensing_wipers = 75;
  bool automatic_headlights = 76;
  bool adaptive_headlights = 77;

  // Extra options available for this vehicle
  repeated string available_extra_option_ids = 78;

  // Drivetrain
  string drivetrain = 79;                 // "FWD", "RWD", "AWD", "4WD"

  // Interior
  string interior_material = 80;         // "cloth", "leather", "vegan_leather", "premium_leather"
  string interior_color = 81;

  // Dimensions
  float length_mm = 82;                   // Length in millimeters
  float width_mm = 83;                    // Width in millimeters
  float height_mm = 84;                   // Height in millimeters
  float wheelbase_mm = 85;                // Wheelbase in millimeters
  float ground_clearance_mm = 86;         // Ground clearance in millimeters

  // Performance metrics
  float horsepower = 87;
  float torque_nm = 88;
  float acceleration_0_100_kph = 89;       // 0-100 km/h in seconds

  // Efficiency
  float fuel_efficiency_city = 90;        // L/100km or kWh/100km
  float fuel_efficiency_highway = 91;     // L/100km or kWh/100km
  float fuel_efficiency_combined = 92;    // L/100km or kWh/100km

  // Emissions
  float co2_emissions_g_km = 93;         // CO2 emissions in grams per km
  string emissions_standard = 94;         // "Euro 6", "BS VI", etc.

  // Additional specifications
  map<string, string> specifications = 95;  // Custom key-value pairs
}

// PropertyAttributes - From User's Draft
message PropertyAttributes {
  // Location
  string street_address = 1;
  string city = 2;
  string state_province = 3;
  string postal_code = 4;
  string country = 5;
  float latitude = 6;
  float longitude = 7;

  // Unit info
  string unit_number = 8;

  // Physical specs
  float area_sqm = 9;
  float bedrooms = 10;
  float bathrooms = 11;
  float living_areas = 12;

  // Amenities
  bool furnished = 13;
  bool kitchen_equipped = 14;
  bool wifi_included = 15;
  bool parking_included = 16;
  bool gym_access = 17;
  bool pool_access = 18;
  bool pets_allowed = 19;
  bool smoking_allowed = 20;
  bool wheelchair_accessible = 21;

  // Building info
  int32 floor_number = 22;
  bool has_elevator = 23;
  bool has_security = 24;
  int32 check_in_hour = 25;
  int32 check_out_hour = 26;

  // Capacity
  int32 max_occupants = 27;
  int32 max_guests_allowed = 28;
}

// EquipmentAttributes - From User's Draft
message EquipmentAttributes {
  // Identity
  string serial_number = 1;
  string manufacturer = 2;
  string model = 3;

  // Condition
  string equipment_type = 4;               // "camera", "drone", "bicycle", "tool"
  string category = 5;                     // "electronics", "sports", "power_tools"

  // Specs
  float weight_kg = 6;
  string color = 7;

  // Usage tracking
  int32 usage_count = 8;                   // Times rented
  float wear_percentage = 9;               // 0-100 estimate of wear

  // Technical
  bool requires_training = 10;
  string training_certification = 11;      // Required cert level
  Money replacement_value = 12;
}

// WorkspaceAttributes - From User's Draft
message WorkspaceAttributes {
  // Location & access
  string street_address = 1;
  string city = 2;
  string postal_code = 3;
  float latitude = 4;
  float longitude = 5;

  // Space type
  string space_type = 6;                   // "meeting_room", "desk", "open_floor"

  // Capacity
  int32 capacity_people = 7;
  int32 capacity_desks = 8;

  // Amenities
  bool wifi = 9;
  bool air_conditioning = 10;
  bool projector = 11;
  bool whiteboard = 12;
  bool video_conferencing = 13;
  bool kitchen_access = 14;
  bool parking = 15;
  bool accessible_restroom = 16;

  // Hours
  int32 open_hour = 17;
  int32 close_hour = 18;
  repeated int32 closed_days = 19;        // 0=Monday, 6=Sunday

  // Access
  string access_method = 20;              // "key", "keycard", "digital_lock"
  bool access_24_hours = 21;
}

// =============================================================================
// PUBLICATION & STATS - From User's Draft
// ============================================================================

message AssetPublicationStats {
  float completion_score = 1;              // 0.0-1.0
  int32 missing_fields_count = 2;
  bool is_ready_for_publish = 3;
  int32 view_count = 4;
  int32 booking_count = 5;
  float average_booking_duration_days = 6;
}

// =============================================================================
// BOOKING/RESERVATION ABSTRACTION - From User's Draft
// ============================================================================

/**
 * AssetBooking is the domain-agnostic booking contract.
 */
message AssetBooking {
  string identifier = 1;
  string asset_id = 2;
  string renter_id = 3;
  string owner_id = 4;

  google.protobuf.Timestamp start_time = 5;
  google.protobuf.Timestamp end_time = 6;

  enum BookingStatus {
    STATUS_UNSPECIFIED = 0;
    STATUS_INQUIRY = 1;
    STATUS_PENDING_OWNER_APPROVAL = 2;
    STATUS_PENDING_RENTER_CONFIRMATION = 3;
    STATUS_CONFIRMED = 4;
    STATUS_ACTIVE = 5;
    STATUS_COMPLETED = 6;
    STATUS_CANCELLED = 7;
    STATUS_DISPUTE = 8;
  }
  BookingStatus status = 7;

  Money total_price = 8;
  Money deposit_required = 9;
  bool is_paid = 10;

  repeated string selected_extra_option_ids = 11;
  Money total_extra_options_price = 12;

  // Domain-specific booking data
  google.protobuf.Any booking_details = 13;

  google.protobuf.Timestamp created_at = 20;
  google.protobuf.Timestamp updated_at = 21;
}

// =============================================================================
// INVENTORY LOCATION - From User's Draft
// ============================================================================

message InventoryLocation {
  string identifier = 1;
  string name = 2;                         // e.g., "Downtown Garage"
  string address = 3;

  // Assets stored here
  repeated string stored_asset_ids = 4;

  // Operational details
  bool is_active = 5;
  string working_hours = 6;
}

// =============================================================================
// ASSET COLLECTIONS - Groups of related assets
// ============================================================================

// Collection of assets (e.g., search results, inventory)
message AssetCollection {
  repeated Asset assets = 1;
  int32 total_count = 2;
  int32 page_size = 3;
  int32 page_number = 4;
  string sort_by = 5;
  string filter_criteria = 6;
  google.protobuf.Timestamp timestamp = 7;
}

// =============================================================================
// ASSET EVENTS - Lifecycle events for assets
// ============================================================================

// Asset lifecycle event
message AssetEvent {
  string identifier = 1;
  string event_type = 2;  // "created", "updated", "deleted", "reserved", "sold", "available", "unavailable"
  Status status = 3;
  google.protobuf.Timestamp event_time = 4;
  string initiated_by = 5;
  map<string, string> event_data = 6;
  TraceContext trace = 7;
  Asset asset_snapshot = 8;  // Optional snapshot of asset state
}
