// Metabolism Protocol Buffers - Nucleotide Signals for the Hive Core
//
// This chromosome defines the ATCG-M metabolic pattern signals that form
// the Hive's nervous system. It is completely decoupled from the Substrate
// (assets) and uses only generic references to assets via identifiers.
//
// The Metabolism (core) knows nothing about specific asset domains - it only
// deals with generic asset identifiers and domain references.

syntax = "proto3";

package aura.core.v1;

import "aura/core/v1/base.proto";
import "aura/core/v1/external_data.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/any.proto";
import "google/protobuf/struct.proto";

// =============================================================================
// SIGNAL - Inbound stimulus to the Hive (A - Aggregator input)
// =============================================================================

message Signal {
  string identifier = 1;  // Schema.org compliant
  SignalType signal_type = 2;
  google.protobuf.Timestamp timestamp = 3;
  google.protobuf.Struct metadata = 4;
  TraceContext trace = 5;

  // Strictly typed payload - no Struct
  oneof payload {
    NegotiationSignal negotiation = 10;
    AuditSignal audit = 11;
    TelegramSignal telegram = 12;
    HeartbeatSignal heartbeat = 13;
    PerceptionSignal perception = 14;
    AssetSignal asset = 15;  // Generic asset signal (decoupled)
    SearchSignal search = 16;
  }
}

enum SignalType {
  SIGNAL_TYPE_UNSPECIFIED = 0;
  SIGNAL_TYPE_NEGOTIATION = 1;
  SIGNAL_TYPE_AUDIT = 2;
  SIGNAL_TYPE_TELEGRAM = 3;
  SIGNAL_TYPE_HEARTBEAT = 4;
  SIGNAL_TYPE_PERCEPTION = 5;
  SIGNAL_TYPE_ASSET = 6;  // Generic asset signals
  SIGNAL_TYPE_SEARCH = 7;
}

// Generic Asset Signal - knows only about asset identifiers and domains
message AssetSignal {
  string asset_identifier = 1;           // Generic reference to any asset
  string asset_domain = 2;                // "VEHICLE", "PROPERTY", etc. (string, not enum)
  string signal_subtype = 3;             // "discovery", "availability_change", "price_update", "booking_request"
  google.protobuf.Any asset_data = 4;    // Opaque payload
}

// Existing signal types (using generic asset references)
message NegotiationSignal {
  string item_identifier = 1;              // Generic item reference
  string item_domain = 2;                 // "VEHICLE", "PROPERTY", etc.
  double bid_amount = 3;
  string currency_code = 4;
  AgentIdentity agent = 5;
  repeated bytes image_data = 6;
  string mime_type = 7;
}

message AgentIdentity {
  string did = 1;             // Decentralized identifier
  float reputation_score = 2; // Reputation score from middleware
}

message AuditSignal {
  string repo_name = 1;
  string git_diff = 2;
  repeated string filesystem_map = 3;
  string event_name = 4;
}

message TelegramSignal {
  int64 user_id = 1;
  int64 chat_id = 2;
  string message_text = 3;
  string callback_data = 4;
}

message HeartbeatSignal {
  string service_name = 1;
  string instance_id = 2;
}

message PerceptionSignal {
  repeated bytes image_data = 1;
  string mime_type = 2;
  AgentIdentity agent = 3;
  string perceived_asset_identifier = 4;  // Generic asset reference
  string perceived_asset_domain = 5;     // Perceived domain
  string prompt = 6;
}

message SearchSignal {
  string query = 1;
  int32 limit = 2;
  float min_similarity = 3;
  string domain = 4;
}

// =============================================================================
// CONTEXT - Enriched understanding after Aggregator processing
// =============================================================================

message Context {
  string identifier = 1;  // Schema.org compliant
  ContextType context_type = 2;
  Status system_health = 3;
  google.protobuf.Struct metadata = 4;
  TraceContext trace = 5;

  // Strictly typed context data
  oneof data {
    HiveContextData hive = 10;
    BeeContextData bee = 11;
    TelegramContextData telegram = 12;
    AssetContextData asset = 13;  // Generic asset context (decoupled)
  }
}

enum ContextType {
  CONTEXT_TYPE_UNSPECIFIED = 0;
  CONTEXT_TYPE_HIVE = 1;
  CONTEXT_TYPE_BEE = 2;
  CONTEXT_TYPE_TELEGRAM = 3;
  CONTEXT_TYPE_ASSET = 4;  // Generic asset context
}

// Generic Asset Context - knows only about asset identifiers
message AssetContextData {
  string asset_identifier = 1;           // Generic asset reference
  string asset_domain = 2;                // Asset domain as string
  map<string, string> asset_metadata = 3; // Generic metadata
  string search_query = 4;
  map<string, string> search_parameters = 5;
  GeographicCoordinates search_location = 6;
  float search_radius_km = 7;
}

// Existing context types
message HiveContextData {
  string item_identifier = 1;
  string item_domain = 2;                 // Generic domain reference
  NegotiationOffer offer = 3;
  string request_id = 4;
}

message NegotiationOffer {
  double bid_amount = 1;
  float reputation = 2;
  string agent_did = 3;
}

message BeeContextData {
  string repo_name = 1;
  string git_diff = 2;
  repeated string filesystem_map = 3;
  map<string, double> hive_metrics = 4;
  string error_message = 5;
  string error_source = 6;
}

message TelegramContextData {
  int64 user_id = 1;
  int64 chat_id = 2;
  string message_text = 3;
  string fsm_state = 4;
}

// =============================================================================
// INTENT - Decision made by the Transformer (T output)
// =============================================================================

// What the Membrane did to the Transformer's proposal on the way out.
//
// The distinction that matters is OVERRIDE vs REFUSE: the Membrane does not
// only reject, it also substitutes deterministic safe values and lets the
// exchange continue. Both were previously indistinguishable from an untouched
// decision once the Intent left the process, since the only trace was an
// aggregate counter and a sentence appended to free-text `reasoning`.
enum DecisionOutcome {
  DECISION_OUTCOME_UNSPECIFIED = 0;
  DECISION_OUTCOME_EMIT = 1;       // passed every gate unaltered
  DECISION_OUTCOME_OVERRIDE = 2;   // a gate fired; a safe value was substituted
  DECISION_OUTCOME_REFUSE = 3;     // a gate fired; the action was rejected
}

// The ordered record of how the guard reached its verdict, and a digest over it.
//
// `outcome_gate` names the rule that refused a decision but not the rules
// consulted before it, so on its own it cannot be replayed: two deployments
// could report the same failing gate having evaluated different sets on the way
// there. This is that record.
//
// Grouped in a message rather than added as two more scalars on Intent so the
// remaining receipt fields (premise hash, policy stamp, signature) have
// somewhere to land without spreading across Intent's number space. See
// docs/DECISION_RECEIPT.md §3.4.
message DecisionDerivation {
  // Gate records in evaluation order, separated by ASCII unit separator (0x1F).
  // Each record is `<gate-id>:<pass|fail>:<comma-separated premise keys>`.
  //
  // Premise KEYS, never their values. This field is meant to be publishable,
  // and recording a value would hand the counterparty the floor price in the
  // one place designed to be read by them — undoing the invariant the Membrane
  // spends its entire outbound path enforcing.
  string gate_sequence = 1;

  // SHA-256 over gate_sequence, lowercase hex. Empty when no gate ran: hashing
  // an empty sequence would assert a derivation that never happened.
  //
  // Redundant with gate_sequence by design. A reader confirms the two agree
  // with one constant-time compare, and only then pays to replay the steps.
  string derivation_hash = 2;
}

// What the Membrane can attest about one decision, in one place.
//
// NOT YET A RECEIPT IN THE SENSE THE SPEC MEANS. VISION §5.1.7 is explicit that
// a receipt without a valid verifier signature is not a receipt regardless of
// any other field, and the signature (§3.7) and premise hash (§3.1) are not
// built. `version` says UNSIGNED for exactly that reason: a consumer must not be
// able to mistake this for the attested article, and a later signed format must
// not be satisfiable by downgrading to this one.
//
// What it does carry is everything checkable without a key: which rules judged
// the decision, how they were applied, what the model proposed, and what was
// actually sent. See docs/DECISION_RECEIPT.md §3.
message DecisionReceipt {
  // Format identifier. `AURA-RECEIPT-V0-UNSIGNED` today. The signed format gets
  // its own name rather than a flag on this one.
  string version = 1;

  // Canonical digest of the decision the Transformer proposed, before the
  // Membrane inspected it. Prose (`reasoning`, `message`, `thought`) is excluded
  // — it is not decidable content, and hashing a model's free text would make
  // the digest irreproducible.
  string claim_hash = 2;

  // The rule set that judged it: `guard/negotiation@1.0.0+<hex16>`. Empty when
  // no rule set was consulted.
  string ruleset_version = 3;

  // How the verdict was reached. Absent when no declared gate ran.
  DecisionDerivation derivation = 4;

  // Canonical digest of what was actually emitted, over the same fields as
  // claim_hash. The two differing IS the Membrane's intervention, stated as a
  // fact a reader can check rather than a claim they must trust.
  string emission_hash = 5;

  // The Membrane's verdict, and the first gate that produced it.
  DecisionOutcome outcome = 6;
  string outcome_gate = 7;

  // First eight bytes of SHA-256 over the content fields, as 16 lowercase hex.
  // A human-legible handle for logs and UI — NOT a binding commitment. Nothing
  // is bound until something signs it.
  string canonical_prefix = 8;

  // Who signed, and how. Absent on an unsigned receipt, which is the honest
  // report rather than an error: a deployment with no key configured produces
  // AURA-RECEIPT-V0-UNSIGNED and says so in `version`.
  ReceiptSignature signature = 11;

  // Reserved for the two fields still blocked on a decision rather than on
  // code. premise_hash (§3.1) waits on who holds the salt — and on the finding
  // that our premises are low-entropy enough that anyone holding it can recover
  // them, so it can only ever be a commitment we open to a trusted party, not a
  // counterparty-verifiable field. policy_stamp (§3.5) waits on the
  // public/committed split.
  reserved 9, 10;
  reserved "premise_hash", "policy_stamp";
}

// The attestation over a receipt's content fields.
//
// Self-describing on purpose: a verifier rebuilds the EIP-712 domain from these
// fields alone and needs no out-of-band configuration to check the signature.
// A receipt that can only be verified by someone who already knows how we are
// configured is not much of a receipt.
message ReceiptSignature {
  // Signature scheme. `eip712` today.
  string scheme = 1;

  // EIP-712 domain, kept DISTINCT from the one TradeIntent signs under
  // (`HackathonRiskRouter`). Domain separation is the standard answer to
  // signing two kinds of thing with one key: a receipt signature is not a valid
  // trade authorisation and a trade authorisation is not a valid receipt.
  //
  // `verifyingContract` is deliberately absent from the domain — a receipt has
  // no contract — which makes the domain structurally different from the trade
  // one, not merely differently named.
  string domain = 2;
  string domain_version = 3;
  uint64 chain_id = 4;

  // The address recovered from a valid signature. A counterparty resolves this
  // against the ERC-8004 identity registry to learn whether it is ours —
  // which is the part a fresh signing key would have no answer for.
  string signer = 5;

  // 0x-prefixed hex.
  string signature = 6;
}

message Intent {
  string identifier = 1;  // Schema.org compliant
  ActionType action = 2;
  string reasoning = 3;
  repeated IntentStep steps = 4;
  google.protobuf.Struct metadata = 5;
  TraceContext trace = 6;

  // Folded into `receipt` below: outcome (7), outcome_gate (8) and
  // derivation (9) lived here first and moved once there was a message to hold
  // them together. Reserved so the numbers cannot be reused for anything else.
  reserved 7, 8, 9;
  reserved "outcome", "outcome_gate", "derivation";

  // What the Membrane attests about this decision. Set at the outbound
  // boundary, never by the Transformer.
  DecisionReceipt receipt = 16;

  // Strictly typed action params
  oneof params {
    NegotiationIntent negotiation = 10;
    AuditIntent audit = 11;
    UIIntent ui = 12;
    AssetIntent asset = 13;  // Generic asset intent (decoupled)
    TradeIntent trade = 14;  // ERC-8004 Genomic Sequencing trade intent
    RWAVaultIntent rwa_vault = 15;  // Institutional RWA-backed stablecoin vault intent
  }
}

// Generic Asset Intent - operates on asset identifiers only
message AssetIntent {
  string asset_identifier = 1;           // Generic asset reference
  string asset_domain = 2;                // Target asset domain
  ActionType action_type = 3;             // Reuses generic ActionType
  map<string, string> action_parameters = 4;
  google.protobuf.Any action_data = 5;    // Opaque payload
}

// Existing intent types
message NegotiationIntent {
  string item_identifier = 1;
  string item_domain = 2;                 // Generic domain reference
  double price = 3;
  string message = 4;
  string thought = 5;
}

message AuditIntent {
  bool is_pure = 1;
  repeated string heresies = 2;
  string narrative = 3;
}

message UIIntent {
  string template_id = 1;
  string text = 2;
  string parse_mode = 3;
}

message IntentStep {
  string skill = 1;
  string intent = 2;
  google.protobuf.Any params = 3;
}

// =============================================================================
// OBSERVATION - Result of Connector execution (C output)
// =============================================================================

message Observation {
  bool success = 1;
  int64 message_id = 2;
  string error = 3;
  string event_type = 4;
  google.protobuf.Struct metadata = 5;
  TraceContext trace = 6;
  repeated float embedding = 7;

  // Strictly typed observation data
  oneof data {
    NegotiationObservation negotiation = 10;
    AuditObservation audit = 11;
    TelegramObservation telegram = 12;
    PerceptionObservation perception = 13;
    AssetObservation asset = 14;  // Generic asset observation (decoupled)
    SearchObservation search = 15;
    DiscoveryObservation discovery = 16;
    BlockchainDiscoveryResult blockchain_discovery = 17;
    TradeObservation trade = 18;  // ERC-8004 Genomic Sequencing trade observation
  }
}

message XenoEntity {
  string repo_url = 1;
  string architecture_type = 2; // "Monolith", "Microservices", "Agentic"
  repeated string detected_interfaces = 3; // ["gRPC", "REST", "NATS"]
  double compatibility_score = 4; // 0.0 to 1.0 (Hill Equation based)
}

message DiscoveryObservation {
  repeated XenoEntity entities = 1;
}

// Generic Asset Observation - returns only asset identifiers
message AssetObservation {
  string asset_identifier = 1;           // Generic asset reference
  string asset_domain = 2;                // Asset domain
  Status status = 3;
  string reservation_code = 4;
  double final_price = 5;
  string currency_code = 6;
  map<string, string> result_data = 7;
}

// Existing observation types
message NegotiationObservation {
  string item_identifier = 1;
  string item_domain = 2;                 // Generic domain reference
  int64 valid_until_timestamp = 3;
  string payment_uri = 4;

  oneof result {
    OfferAccepted accepted = 5;
    OfferCountered countered = 6;
    OfferRejected rejected = 7;
  }
}

message OfferAccepted {
  double final_price = 1;
  string currency_code = 2;

  oneof reveal_method {
    string reservation_code = 3;
    CryptoPaymentInstructions crypto_payment = 4;
  }
}

message CryptoPaymentInstructions {
  string deal_id = 1;
  string wallet_address = 2;
  double amount = 3;
  string currency = 4;
  string memo = 5;
  string network = 6;
  int64 expires_at = 7;
}

message OfferCountered {
  double proposed_price = 1;
  string reason_code = 2;
  string human_message = 3;
}

message OfferRejected {
  string reason_code = 1;
}

message AuditObservation {
  bool is_pure = 1;
  repeated string heresies = 2;
  string narrative = 3;
  string reasoning = 4;
  double execution_time = 5;
  int32 token_usage = 6;
  google.protobuf.Struct metadata = 10;
}

message TelegramObservation {
  int64 message_id = 1;
  bool delivered = 2;
}

message PerceptionObservation {
  string perceived_asset_identifier = 1;  // Generic asset reference
  string perceived_asset_domain = 2;     // Perceived domain
}

message SearchObservation {
  repeated google.protobuf.Any results = 1;
  int32 total_count = 2;
}

message PaymentProof {
  string transaction_hash = 1;
  string block_number = 2;
  string from_address = 3;
  google.protobuf.Timestamp confirmed_at = 4;
}

message TransactionContext {
  string deal_id = 1;
  double amount = 2;
  string currency = 3;
  string status = 4;
}

// =============================================================================
// EVENT - Emitted to the Hive's bloodstream (G output -> NATS JetStream)
// =============================================================================

message Event {
  string identifier = 1;  // Schema.org compliant
  string topic = 2;
  google.protobuf.Timestamp timestamp = 3;
  google.protobuf.Struct metadata = 4;
  TraceContext trace = 5;

  // Strictly typed event payload
  oneof payload {
    NegotiationEvent negotiation = 10;
    VitalsEvent vitals = 11;
    AlertEvent alert = 12;
    HeartbeatEvent heartbeat = 13;
    AuditEvent audit = 14;
    LogEvent log = 15;
    AssetEvent asset = 16;  // Generic asset event (decoupled)
    TradeEvent trade = 17;  // ERC-8004 Genomic Sequencing trade event
  }
}

// Generic Asset Event - contains only asset identifiers
message AssetEvent {
  string asset_identifier = 1;           // Generic asset reference
  string asset_domain = 2;                // Asset domain
  string event_type = 3;                 // "created", "updated", "deleted", "reserved", "sold"
  google.protobuf.Timestamp event_time = 4;
  string initiated_by = 5;
  map<string, string> event_data = 6;
}

// Existing event types
message LogEvent {
  string level = 1;
  string message = 2;
  string logger_name = 3;
  string worker_name = 4;
}

message NegotiationEvent {
  string item_identifier = 1;
  string item_domain = 2;                 // Generic domain reference
  ActionType action = 3;
  double price = 4;
}

message VitalsEvent {
  string service = 1;
  Status status = 2;
  double cpu_usage_percent = 3;
  double memory_usage_mb = 4;
}

message AlertEvent {
  Severity severity = 1;
  string message = 2;
  string source = 3;
}

message HeartbeatEvent {
  string service = 1;
  string instance_id = 2;
  Status status = 3;
}

message AuditEvent {
  string repo_name = 1;
  bool is_pure = 2;
  repeated string heresies = 3;
  double negotiation_success_rate = 4;
}

// =============================================================================
// ERC-8004 GENOMIC SEQUENCING - Trade Intent and Validation
// =============================================================================

/**
 * TradeIntent represents a structured trade decision following ERC-8004
 * Genomic Sequencing standards. This enables the Transformer (LLM) to
 * generate trade intentions in a format compatible with Risk Router systems.
 */
message TradeIntent {
  string trade_id = 1;                    // Unique trade identifier
  string asset_identifier = 2;           // Reference to the asset being traded
  string asset_domain = 3;                // Asset domain (e.g., "VEHICLE", "PROPERTY")
  double proposed_price = 4;             // Proposed trade price
  string currency_code = 5;               // ISO 4217 currency code
  ValidationScore validation_score = 6;  // Risk assessment score
  string reasoning = 7;                   // LLM reasoning for the trade decision
  map<string, string> metadata = 8;      // Additional trade context
  string eip712_domain = 9;               // EIP-712 domain separator
  string eip712_types = 10;               // EIP-712 type definitions
  google.protobuf.Struct eip712_message = 11; // EIP-712 structured message
}

/**
 * ValidationScore represents risk assessment following ERC-8004 standards.
 * Lower risk_score values indicate lower risk (0.0 = no risk, 1.0 = maximum risk).
 */
message ValidationScore {
  double risk_score = 1;                  // Risk assessment (0.0-1.0, lower is better)
  string risk_category = 2;              // "LOW", "MEDIUM", "HIGH", "CRITICAL"
  string validation_method = 3;          // "EIP-712", "ERC-8004", "CUSTOM"
  string validation_context = 4;         // Additional validation details
  google.protobuf.Timestamp validated_at = 5; // When validation occurred
  repeated string validation_rules = 6;  // Rules applied during validation
  map<string, string> validation_metadata = 7; // Additional validation data
}

// =============================================================================
// ERC-8004 GENOMIC SEQUENCING - Trade Observation
// =============================================================================

/**
 * TradeObservation represents the result of executing a trade intent.
 * This includes payment verification, asset transfer, and validation results.
 */
message TradeObservation {
  string trade_id = 1;                    // Reference to the original trade intent
  string asset_identifier = 2;           // Asset being traded
  string asset_domain = 3;                // Asset domain
  Status status = 4;                     // Overall trade status
  ValidationScore validation_score = 5;  // Final validation score

  // Payment information
  string payment_transaction_hash = 6;   // Blockchain transaction hash
  string payment_network = 7;             // "eip155:8453" (Base), "solana", etc.
  string payment_currency = 8;            // "USDC", "SOL", etc.
  double payment_amount = 9;             // Amount paid
  string payment_status = 10;             // "PENDING", "COMPLETED", "FAILED"

  // Trade execution results
  string trade_result = 11;               // "SUCCESS", "FAILED", "REJECTED", "PENDING"
  string failure_reason = 12;             // If failed, why
  map<string, string> execution_metadata = 13; // Additional execution details

  // ERC-8004 validation results
  repeated string validation_rules_applied = 14; // Rules that were checked
  repeated string validation_warnings = 15; // Non-critical validation issues
  repeated string validation_errors = 16; // Critical validation failures

  // EIP-712 signing information
  string eip712_signature = 17;           // Cryptographic signature
  string eip712_signed_by = 18;           // Address that signed
  string eip712_domain_hash = 19;         // Domain separator hash
  string eip712_message_hash = 20;        // Message hash
}

// =============================================================================
// ERC-8004 GENOMIC SEQUENCING - Trade Event
// =============================================================================

/**
 * TradeEvent represents trade-related events emitted to the Hive's bloodstream.
 * This includes trade creation, execution, validation, and completion events.
 */
message TradeEvent {
  string trade_id = 1;                    // Unique trade identifier
  string asset_identifier = 2;           // Asset being traded
  string asset_domain = 3;                // Asset domain
  string event_type = 4;                 // "TRADE_CREATED", "TRADE_EXECUTED", "TRADE_VALIDATED", "TRADE_COMPLETED", "TRADE_FAILED"
  google.protobuf.Timestamp event_time = 5;
  string initiated_by = 6;               // Agent or service that initiated the event

  // Trade-specific data
  oneof trade_data {
    TradeCreatedEvent created = 7;
    TradeExecutedEvent executed = 8;
    TradeValidatedEvent validated = 9;
    TradeCompletedEvent completed = 10;
    TradeFailedEvent failed = 11;
  }
}

message TradeCreatedEvent {
  string trade_intent_id = 1;            // Reference to the original intent
  double proposed_price = 2;             // Proposed trade price
  string currency_code = 3;               // ISO 4217 currency code
  ValidationScore initial_validation = 4; // Initial validation score
}

message TradeExecutedEvent {
  string payment_transaction_hash = 1;   // Blockchain transaction hash
  string payment_network = 2;             // "eip155:8453" (Base), "solana", etc.
  double payment_amount = 3;             // Amount paid
  string payment_currency = 4;            // "USDC", "SOL", etc.
}

message TradeValidatedEvent {
  ValidationScore validation_score = 1;  // Final validation score
  repeated string validation_rules = 2;  // Rules applied
  repeated string validation_warnings = 3; // Non-critical issues
  repeated string validation_errors = 4; // Critical failures
}

message TradeCompletedEvent {
  string final_price = 1;                 // Final agreed price
  string currency_code = 2;               // ISO 4217 currency code
  string reservation_code = 3;           // Reservation/reference code
  string eip712_signature = 4;           // Cryptographic signature
}

message TradeFailedEvent {
  string failure_reason = 1;             // Why the trade failed
  string error_code = 2;                 // Machine-readable error code
  map<string, string> error_details = 3; // Additional error context
}

// ============================================================
// Institutional RWA-Backed Stablecoin Vault (StableHacks 2026)
// ============================================================

// RWAComplianceScore captures the KYC/AML result for a vault intent.
// The Agent must act as a strict compliance officer before any vault action.
message RWAComplianceScore {
  bool kyc_passed = 1;
  bool aml_passed = 2;
  string compliance_status = 3;  // "APPROVED", "REJECTED", "PENDING"
  string violation_code = 4;     // "KYC_MISSING", "AML_SUSPICIOUS", "ASSET_UNVERIFIED", or ""
  string think = 5;              // LLM <think> reasoning block
  repeated string flags = 6;     // Human-readable compliance flags
}

// RWAVaultIntent is the structured output for locking/minting RWA-backed
// stablecoin collateral on Solana. Triggered by the AuraTransformer when
// rwa_mode is set in Context.metadata.
message RWAVaultIntent {
  string vault_id = 1;
  string asset_identifier = 2;
  string asset_domain = 3;           // "GOLD", "REAL_ESTATE", "VEHICLE", etc.
  double appraised_value_usd = 4;    // Raw appraisal from vision + SIX rates
  double ltv_ratio = 5;              // e.g. 0.60
  double collateral_value_usd = 6;   // appraised_value_usd * ltv_ratio
  string stablecoin_currency = 7;    // "USDC"
  string wallet_address = 8;
  RWAComplianceScore compliance = 9;
  string reasoning = 10;
  map<string, string> metadata = 11;
}
