// Assets Protocol Buffers - Universal Asset Model for the Hive
//
// This chromosome contains the complete Universal Asset Model based on the
// User's Asset Draft. It represents the Substrate - the genetic material
// that encodes the Hive's ability to interact with real-world assets.
//
// This file is completely decoupled from the Metabolism (core) and contains
// only domain-specific asset representations.

syntax = "proto3";

package aura.assets.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/any.proto";

// =============================================================================
// DOMAIN ENUMS - Asset classification system
// ============================================================================

enum AssetDomain {
  ASSET_DOMAIN_UNSPECIFIED = 0;
  ASSET_DOMAIN_VEHICLE = 1;      // Car, bike, scooter rental
  ASSET_DOMAIN_PROPERTY = 2;     // Short-term rentals (Airbnb-style)
  ASSET_DOMAIN_EQUIPMENT = 3;    // Tools, cameras, sports gear
  ASSET_DOMAIN_WORKSPACE = 4;    // Coworking, meeting rooms
}

enum AssetStatus {
  ASSET_STATUS_UNSPECIFIED = 0;
  ASSET_STATUS_DRAFT = 1;          // Not yet published
  ASSET_STATUS_AVAILABLE = 2;      // Open for bookings
  ASSET_STATUS_BOOKED = 3;         // Currently rented
  ASSET_STATUS_MAINTENANCE = 4;    // Under maintenance
  ASSET_STATUS_ARCHIVED = 5;       // Deactivated
}

enum AssetCondition {
  ASSET_CONDITION_UNSPECIFIED = 0;
  ASSET_CONDITION_NEW = 1;
  ASSET_CONDITION_EXCELLENT = 2;
  ASSET_CONDITION_GOOD = 3;
  ASSET_CONDITION_FAIR = 4;
  ASSET_CONDITION_POOR = 5;
}

enum RentalFrequency {
  RENTAL_FREQUENCY_UNSPECIFIED = 0;
  RENTAL_FREQUENCY_HOURLY = 1;
  RENTAL_FREQUENCY_DAILY = 2;
  RENTAL_FREQUENCY_WEEKLY = 3;
  RENTAL_FREQUENCY_MONTHLY = 4;
  RENTAL_FREQUENCY_CUSTOM = 5;
}

// =============================================================================
// CORE RENTAL CONTRACT
// ============================================================================

/**
 * RentalTerms defines the contract for how an asset can be rented.
 * This is domain-agnostic and applies to all rentable assets.
 */
message RentalTerms {
  // Pricing
  repeated PriceTier price_tiers = 1;        // Duration-based pricing
  repeated CancellationFee cancellation_fees = 2;      // Fees per cancellation window

  // Availability
  repeated AvailabilityWindow availability_windows = 3;
  int32 min_rental_duration_hours = 4;       // Minimum rental period
  int32 max_rental_duration_hours = 5;       // Maximum rental period

  // Operational constraints
  bool requires_approval = 6;                // Must owner approve manually?
  int32 approval_timeout_hours = 7;          // Time limit for approval
  int32 no_response_auto_cancel_hours = 8;   // Auto-cancel if no response

  // Damage & liability
  DamagePolicy damage_policy = 9;
  InsurancePolicy insurance_policy = 10;

  // Restrictions
  repeated string allowed_countries = 11;    // Geo-restrictions
  int32 min_renter_age = 12;
  map<string, string> custom_rules = 13;     // Domain-specific rules
}

message PriceTier {
  int32 min_duration_days = 1;    // Applies from this duration
  int32 max_duration_days = 2;    // Until this duration (0 = unlimited)
  double price_per_day = 3;
  string currency_code = 4;       // ISO 4217 currency code
  float discount_percent = 5;     // E.g., 10% off for weekly rentals
}

message CancellationFee {
  int32 hours_before_start = 1;    // How many hours before start
  double fee_amount = 2;
  string currency_code = 3;       // ISO 4217 currency code
  float fee_percent = 4;          // Percentage of total price (0-100)
}

message AvailabilityWindow {
  int32 day_of_week = 1;          // 0=Monday, 6=Sunday
  int32 start_hour = 2;           // 0-23
  int32 end_hour = 3;             // 0-23
  bool is_blocked = 4;            // True = asset not available
}

message DamagePolicy {
  enum DamageLevel {
    DAMAGE_LEVEL_UNSPECIFIED = 0;
    DAMAGE_LEVEL_MINOR = 1;
    DAMAGE_LEVEL_MODERATE = 2;
    DAMAGE_LEVEL_SEVERE = 3;
    DAMAGE_LEVEL_TOTAL_LOSS = 4;
  }
  map<int32, double> damage_charges = 1;  // DamageLevel -> charge amount
  string currency_code = 2;                 // ISO 4217 currency code
  double deductible = 3;                   // Renter pays up to this amount
  bool optional = 4;                      // Can renter decline coverage?
}

message InsurancePolicy {
  double premium_per_day = 1;
  string currency_code = 2;               // ISO 4217 currency code
  string provider = 3;
  string policy_number = 4;
  double max_coverage = 5;
  bool included_in_base_price = 6;
  string coverage_details = 7;            // HTML or markdown
}

// =============================================================================
// UNIVERSAL ASSET ENTITY - The Sovereign Contract
// ============================================================================

/**
 * Asset is the primary rental object, domain-agnostic.
 * Core properties apply to all domains. Domain-specific attributes in oneof.
 */
message Asset {
  // === CORE IDENTIFIERS ===
  string identifier = 1;                          // UUID
  string organization_id = 2;             // Owner/organization UUID

  // === DISPLAY & CLASSIFICATION ===
  string name = 3;                        // "BMW X5" or "Downtown Loft"
  string description = 4;                 // Marketing description
  repeated string images = 5;             // Image URLs (primary first)
  string thumbnail_url = 6;               // Quick-load thumbnail

  AssetDomain domain = 7;
  AssetStatus status = 8;
  AssetCondition condition = 9;

  // === RENTAL CONTRACT ===
  RentalTerms rental_terms = 10;          // How this asset can be rented

  // === DOMAIN-SPECIFIC DETAILS ===
  oneof details {
    VehicleAttributes vehicle = 11;
    PropertyAttributes property = 12;
    EquipmentAttributes equipment = 13;
    WorkspaceAttributes workspace = 14;
  }

  // === OPERATIONAL DATA ===
  OperationalMetadata operations = 15;    // Maintenance, incidents, capacity

  // === REPUTATION & RATINGS ===
  RatingStats rating_stats = 16; // Aggregate ratings

  // === TIMESTAMPS ===
  google.protobuf.Timestamp created_at = 20;
  google.protobuf.Timestamp updated_at = 21;

  // === METADATA ===
  AssetPublicationStats stats = 22;
  bool is_published = 23;                 // Ready for public discovery?
}

// Rating statistics
message RatingStats {
  double average_rating = 1;             // 1.0 to 5.0
  int32 rating_count = 2;
  double best_rating = 3;                // Typically 5.0
  double worst_rating = 4;               // Typically 1.0
}

// =============================================================================
// OPERATIONAL METADATA
// ============================================================================

/**
 * OperationalMetadata tracks non-rental data about asset management.
 */
message OperationalMetadata {
  // Maintenance
  MaintenanceSchedule maintenance_schedule = 1;
  google.protobuf.Timestamp last_maintenance_at = 2;
  google.protobuf.Timestamp next_maintenance_at = 3;

  // Capacity & inventory
  int32 total_units = 4;                  // For multi-unit assets
  int32 available_units = 5;              // How many free right now

  // Current state
  string current_location = 6;            // Where is it right now?
  float current_occupancy_percent = 7;    // 0-100

  // Incidents & damage log
  repeated IncidentLog incidents = 8;

  // Service-level agreements
  string sla_tier = 9;                    // "basic", "premium", "enterprise"
  google.protobuf.Timestamp last_inspection_at = 10;
}

message MaintenanceSchedule {
  enum MaintenanceType {
    MAINTENANCE_TYPE_UNSPECIFIED = 0;
    MAINTENANCE_TYPE_ROUTINE = 1;
    MAINTENANCE_TYPE_SEASONAL = 2;
    MAINTENANCE_TYPE_EMERGENCY = 3;
  }
  MaintenanceType type = 1;
  int32 frequency_days = 2;               // Every N days
  string description = 3;
  repeated google.protobuf.Timestamp scheduled_dates = 4;
}

message IncidentLog {
  string identifier = 1;
  google.protobuf.Timestamp date = 2;
  string severity = 3;                    // "minor", "major", "critical"
  string description = 4;
  string reported_by = 5;                 // renter or owner
  double repair_cost = 6;
  string currency_code = 7;               // ISO 4217 currency code
  string status = 8;                      // "open", "in_progress", "resolved"
}

// =============================================================================
// DOMAIN-SPECIFIC ATTRIBUTES
// ============================================================================

// VehicleAttributes - Comprehensive vehicle representation
message VehicleAttributes {
  // Legal identifiers
  string registration_number = 1;
  string vin = 2;                          // Vehicle Identification Number
  string license_plate = 3;

  // Classification
  string type = 4;                         // "car", "motorcycle", "scooter", "bike", "e_bike", "e_scooter"
  string sub_type = 5;                     // "sedan", "suv", "hatchback", "luxury", "compact", "exotic"

  // Basic specs
  string brand = 6;
  string model = 7;
  int32 year = 8;
  string color = 9;

  // Performance specs (EV-enhanced)
  string transmission = 10;                // "automatic", "manual", "cvt", "direct_drive"
  string fuel_type = 11;                   // "petrol", "diesel", "electric", "hybrid", "hydrogen", "cng"
  float fuel_capacity_liters = 12;
  float current_fuel_level_percent = 13;
  float current_battery_level_percent = 14; // 0.0 to 100.0 for EVs
  float battery_capacity_kwh = 15;        // For electric vehicles
  float estimated_range_km = 16;           // Current range estimate
  float max_range_km = 17;                 // Maximum range when fully charged/fueled
  bool is_charging = 18;                   // Currently charging?
  float charging_speed_kw = 19;           // Charging speed in kW
  float engine_capacity_cc = 20;
  float mileage_km = 21;
  float max_speed_kph = 22;               // Maximum speed

  // Capacity
  int32 seats = 23;
  int32 doors = 24;
  float max_luggage_capacity_liters = 25;
  float max_weight_kg = 26;
  int32 baggage_capacity_large = 27;      // Large suitcases
  int32 baggage_capacity_small = 28;      // Small suitcases

  // Features
  bool air_conditioning = 29;
  bool navigation_system = 30;
  bool bluetooth = 31;
  bool all_wheel_drive = 32;
  bool sunroof = 33;
  bool cruise_control = 34;
  bool airbags = 35;
  bool wheelchair_accessible = 36;
  bool adaptive_cruise_control = 37;
  bool lane_keeping_assist = 38;
  bool blind_spot_monitoring = 39;
  bool rear_view_camera = 40;
  bool apple_car_play = 41;
  bool android_auto = 42;
  bool heated_seats = 43;
  bool ventilated_seats = 44;
  bool massage_seats = 45;
  bool premium_audio = 46;
  bool panoramic_roof = 47;
  bool keyless_entry = 48;
  bool remote_start = 49;
  bool wireless_charging = 50;
  bool heads_up_display = 51;
  bool ambient_lighting = 52;
  bool memory_seats = 53;
  bool heated_steering_wheel = 54;
  bool power_liftgate = 55;
  bool surround_view_camera = 56;
  bool night_vision = 57;
  bool self_parking = 58;

  // Safety requirements
  bool helmet_required = 59;
  int32 minimum_driver_age = 60;
  repeated string required_licenses = 61;

  // Electric vehicle specific
  string charger_type = 62;               // "Type1", "Type2", "CCS", "CHAdeMO", "Tesla"
  float charging_time_hours = 63;        // 0-100% charge time
  bool fast_charging_capable = 64;

  // Additional specifications
  map<string, string> specifications = 65;
}

// PropertyAttributes
message PropertyAttributes {
  string street_address = 1;
  string city = 2;
  string state_province = 3;
  string postal_code = 4;
  string country = 5;
  float latitude = 6;
  float longitude = 7;
  string unit_number = 8;
  float area_sqm = 9;
  float bedrooms = 10;
  float bathrooms = 11;
  float living_areas = 12;
  bool furnished = 13;
  bool kitchen_equipped = 14;
  bool wifi_included = 15;
  bool parking_included = 16;
  bool gym_access = 17;
  bool pool_access = 18;
  bool pets_allowed = 19;
  bool smoking_allowed = 20;
  bool wheelchair_accessible = 21;
  int32 floor_number = 22;
  bool has_elevator = 23;
  bool has_security = 24;
  int32 check_in_hour = 25;
  int32 check_out_hour = 26;
  int32 max_occupants = 27;
  int32 max_guests_allowed = 28;
}

// EquipmentAttributes
message EquipmentAttributes {
  string serial_number = 1;
  string manufacturer = 2;
  string model = 3;
  string equipment_type = 4;
  string category = 5;
  float weight_kg = 6;
  string color = 7;
  int32 usage_count = 8;
  float wear_percentage = 9;
  bool requires_training = 10;
  string training_certification = 11;
}

// WorkspaceAttributes
message WorkspaceAttributes {
  string street_address = 1;
  string city = 2;
  string postal_code = 3;
  float latitude = 4;
  float longitude = 5;
  string space_type = 6;
  int32 capacity_people = 7;
  int32 capacity_desks = 8;
  bool wifi = 9;
  bool air_conditioning = 10;
  bool projector = 11;
  bool whiteboard = 12;
  bool video_conferencing = 13;
  bool kitchen_access = 14;
  bool parking = 15;
  bool accessible_restroom = 16;
  int32 open_hour = 17;
  int32 close_hour = 18;
  repeated int32 closed_days = 19;
  string access_method = 20;
  bool access_24_hours = 21;
}

// =============================================================================
// PUBLICATION & STATS
// ============================================================================

message AssetPublicationStats {
  float completion_score = 1;              // 0.0-1.0
  int32 missing_fields_count = 2;
  bool is_ready_for_publish = 3;
  int32 view_count = 4;
  int32 booking_count = 5;
  float average_booking_duration_days = 6;
}

// =============================================================================
// BOOKING/RESERVATION ABSTRACTION
// ============================================================================

/**
 * AssetBooking is the domain-agnostic booking contract.
 */
message AssetBooking {
  string identifier = 1;
  string asset_id = 2;
  string renter_id = 3;
  string owner_id = 4;

  google.protobuf.Timestamp start_time = 5;
  google.protobuf.Timestamp end_time = 6;

  enum BookingStatus {
    BOOKING_STATUS_STATUS_UNSPECIFIED = 0;
    BOOKING_STATUS_STATUS_INQUIRY = 1;
    BOOKING_STATUS_STATUS_PENDING_OWNER_APPROVAL = 2;
    BOOKING_STATUS_STATUS_PENDING_RENTER_CONFIRMATION = 3;
    BOOKING_STATUS_STATUS_CONFIRMED = 4;
    BOOKING_STATUS_STATUS_ACTIVE = 5;
    BOOKING_STATUS_STATUS_COMPLETED = 6;
    BOOKING_STATUS_STATUS_CANCELLED = 7;
    BOOKING_STATUS_STATUS_DISPUTE = 8;
  }
  BookingStatus status = 7;

  double total_price = 8;
  string currency_code = 9;               // ISO 4217 currency code
  double deposit_required = 10;
  bool is_paid = 11;

  repeated string selected_extra_option_ids = 12;
  double total_extra_options_price = 13;
  string currency_code_extra = 14;        // ISO 4217 currency code for extras

  // Domain-specific booking data
  google.protobuf.Any booking_details = 15;

  google.protobuf.Timestamp created_at = 20;
  google.protobuf.Timestamp updated_at = 21;
}

// =============================================================================
// INVENTORY LOCATION
// ============================================================================

message InventoryLocation {
  string identifier = 1;
  string name = 2;                         // e.g., "Downtown Garage"
  string address = 3;

  // Assets stored here
  repeated string stored_asset_ids = 4;

  // Operational details
  bool is_active = 5;
  string working_hours = 6;
}

// =============================================================================
// ASSET COLLECTIONS
// ============================================================================

message AssetCollection {
  repeated Asset assets = 1;
  int32 total_count = 2;
  int32 page_size = 3;
  int32 page_number = 4;
  string sort_by = 5;
  string filter_criteria = 6;
  google.protobuf.Timestamp timestamp = 7;
}

// =============================================================================
// ASSET EVENTS
// ============================================================================

message AssetEvent {
  string identifier = 1;
  string event_type = 2;  // "created", "updated", "deleted", "reserved", "sold", "available", "unavailable"
  google.protobuf.Timestamp event_time = 3;
  string initiated_by = 4;
  map<string, string> event_data = 5;
  Asset asset_snapshot = 6;  // Optional snapshot of asset state
}
